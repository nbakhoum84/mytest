&lt;style&gt;
  /* Everything is scoped under .wr so it cannot restyle the platform's header,
     listing grid or footer. Class names are prefixed wr- to avoid collisions. */
  .wr {
    --paper: #F6F3EC;
    --paper-line: #DAD4C4;
    --ink: #1C2B39;
    --ink-soft: #48576A;
    --brass: #B0793A;
    --brass-deep: #8E5F27;
    --survey-green: #54746A;
    --muted: #6B6556;
    --white: #FFFFFF;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wr *, .wr *::before, .wr *::after { box-sizing: border-box; }
  /* :where() keeps the reset at zero specificity so the component rules below always win */
  .wr :where(h1, h2, h3, p, ul, ol, li, blockquote, figure) { margin: 0; padding: 0; }
  .wr :where(ul, ol) { list-style: none; }
  .wr a { color: var(--brass-deep); }
  .wr a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  .wr-wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
  .wr-mono { font-family: var(--mono); }

  /* Hero */
  .wr-hero-bg { position: relative; }
  .wr-hero-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(28, 43, 57, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28, 43, 57, .05) 1px, transparent 1px);
    background-size: 220px 220px;
    pointer-events: none;
  }
  .wr-crumbs {
    position: relative;
    padding-top: 26px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .wr-crumbs ol { display: flex; flex-wrap: wrap; gap: 6px; }
  .wr-crumbs li + li::before { content: "/"; margin-right: 6px; }
  .wr-crumbs a { color: inherit; text-decoration: none; }
  .wr-crumbs a:hover { color: var(--brass-deep); }

  .wr-hero { position: relative; padding: 22px 0 44px; }
  .wr-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--brass-deep);
  }
  .wr-eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--brass-deep); }
  .wr-hero h2 {
    max-width: 18ch;
    font-family: var(--serif);
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 500;
    line-height: 1.1;
  }
  .wr-sub { margin-top: 20px; max-width: 70ch; font-size: 16.5px; line-height: 1.7; color: var(--ink-soft); }
  .wr-note { margin-top: 14px; max-width: 70ch; font-size: 14px; color: var(--ink-soft); }

  /* Sections */
  .wr-block { position: relative; padding: 70px 0; }
  .wr-block-tight { padding-top: 0; }
  .wr-head { max-width: 640px; margin-bottom: 40px; }
  .wr-head h2 {
    font-family: var(--serif);
    font-size: clamp(24px, 2.6vw, 32px);

  .wr-faq details { border-bottom: 1px solid var(--paper-line); }

    justify-content: space-between;
    gap: 20px;
    padding: 22px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  .wr-faq summary::-webkit-details-marker { display: none; }
  .wr-faq summary::after {
    content: "+";
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 18px;
    color: var(--brass-deep);
    transition: transform .2s ease;
  }
  .wr-faq details[open] summary::after { transform: rotate(45deg); }
  .wr-faq summary:focus-visible { outline: 2px solid var(--brass-deep); outline-offset: 2px; }
  .wr-faq details p { max-width: 70ch; padding-bottom: 22px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }

  /* Calls to action */
  .wr-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--ink); border: 1px solid var(--ink); }
  .wr-cta &gt; div { padding: 38px; background: var(--paper); }
  .wr-cta .wr-mono { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--survey-green); }
  .wr-cta h3 { margin: 10px 0 18px; font-family: var(--serif); font-size: 21px; font-weight: 500; }
  .wr-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .15s ease;
  }
  .wr a.wr-btn { color: var(--paper); }
  .wr-btn:hover, .wr a.wr-btn:hover { background: var(--brass-deep); color: var(--paper); }

  /* Market snapshot (reuses the .wr-neigh grid so it matches the neighbourhood block) */
  .wr-neigh-4 { grid-template-columns: repeat(4, 1fr); }
  .wr-kpis li { padding: 22px 26px; }
  .wr-kpi-val { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1.2; }
  .wr-types { margin-top: 28px; }
  .wr-facts { margin: 14px 0 0; }
  .wr-facts &gt; div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--paper-line); font-size: 14px; }
  .wr-facts &gt; div:last-child { border-bottom: 0; }
  .wr-facts dt { color: var(--ink-soft); }
  .wr-facts dd { margin: 0; font-weight: 600; text-align: right; }
  .wr-marketnote { max-width: 70ch; margin-top: 28px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
  .wr-src { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* Compliance */
  .wr-legal { padding: 0 32px 40px; max-width: 1180px; margin: 0 auto; font-size: 12px; line-height: 1.6; color: var(--muted); }

  @media (max-width: 860px) {
    .wr-wrap { padding: 0 20px; }
    .wr-neigh, .wr-life, .wr-cta { grid-template-columns: 1fr; }
    .wr-take-inner { grid-template-columns: 1fr; gap: 16px; }
    .wr-legal { padding: 0 20px 40px; }
    .wr-block { padding: 48px 0; }
    .wr-neigh-4 { grid-template-columns: repeat(2, 1fr); }
  }

        &lt;p class="wr-sub"&gt;White Rock is one of the smallest cities in Metro Vancouver by land area, wrapped around Semiahmoo Bay and anchored by the 470&amp;#8209;metre White Rock Pier, built in 1914 and billed by the city's own signage as Canada's longest pier. Though Surrey surrounds it on the north, east, and west, White Rock has governed itself as an independent city since 1957, with its own council, its own hospital, and a beach&amp;#8209;town character that sets it apart from its much larger neighbour. With hundreds of active listings, prices range from smaller condos to homes on the bluff or waterfront. Whether you're after a &lt;strong&gt;condo steps from the promenade&lt;/strong&gt;, a &lt;strong&gt;character home up the hill&lt;/strong&gt;, or something in between, White Rock offers about as short a walk to the water as anywhere in the Lower Mainland.&lt;/p&gt;

            &lt;div&gt;&lt;dt&gt;Active now&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.active"&gt;133&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median list price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianList"&gt;$1,938,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.sold"&gt;99&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianSold"&gt;$1,565,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.dom"&gt;32&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/li&gt;
      &lt;/ul&gt;

      &lt;p class="wr-marketnote"&gt;About &lt;span data-wr="perMonth"&gt;31&lt;/span&gt; homes sold per month over the past year, and half of them sold within &lt;span data-wr="domMedian"&gt;31&lt;/span&gt; days of listing. Condos are the bulk of the market: &lt;span data-wr="condo.sold"&gt;235&lt;/span&gt; of the &lt;span data-wr="sold12"&gt;369&lt;/span&gt; sales and &lt;span data-wr="condo.active"&gt;164&lt;/span&gt; of the &lt;span data-wr="active"&gt;322&lt;/span&gt; active listings, with a median sold price of &lt;span data-wr="condo.medianSold"&gt;$550,000&lt;/span&gt; against &lt;span data-wr="sfh.medianSold"&gt;$1,565,000&lt;/span&gt; for single&amp;#8209;family homes. At the past year's sales pace, today's active listings equal roughly &lt;span data-wr="supplyAll"&gt;10&lt;/span&gt; months of supply overall, about &lt;span data-wr="supplyCondo"&gt;8&lt;/span&gt; months for condos and about &lt;span data-wr="supplySfh"&gt;16&lt;/span&gt; for single&amp;#8209;family homes. Supply above about six months generally favours buyers. Want numbers for a specific street or building? &lt;a href="/sell"&gt;Ask for a free home valuation&lt;/a&gt;, or see the &lt;a href="/latest-market-updates"&gt;latest market updates&lt;/a&gt; and &lt;a href="/white-rock-sold-listings"&gt;recently sold White Rock homes&lt;/a&gt;.&lt;/p&gt;
      &lt;p class="wr-src"&gt;Source: MLS&amp;reg; listing and sold data shown on this site. Active listings were counted on &lt;span data-wr="asOf"&gt;October 30, 2026&lt;/span&gt;. Sales cover &lt;span data-wr="windowStart"&gt;September 2025&lt;/span&gt; to &lt;span data-wr="windowEnd"&gt;August 2026&lt;/span&gt; because sales from the most recent weeks are not yet fully reported. Days to sell is the time from listing date to sale date. The cards leave out &lt;span data-wr="otherActive"&gt;8&lt;/span&gt; other active listings and &lt;span data-wr="otherSales"&gt;12&lt;/span&gt; other sales (vacant land, manufactured and multi&amp;#8209;family).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

          if (v !== undefined &amp;&amp; ok.test(String(v))) el.textContent = String(v);

    })();
  &lt;/script&gt;

  &lt;section class="wr-block" aria-labelledby="wr-neigh-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Coverage&lt;/div&gt;
        &lt;h2 id="wr-neigh-title"&gt;Neighbourhoods in White Rock&lt;/h2&gt;
        &lt;p&gt;This search spans the following White Rock communities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;ul class="wr-neigh"&gt;
        &lt;li&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;01&lt;/div&gt;
          &lt;h3&gt;Waterfront / Marine Drive&lt;/h3&gt;
          &lt;p&gt;The promenade and restaurant row along the beach, with condo towers steps from the pier and some of the highest price points in the city.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;02&lt;/div&gt;
          &lt;h3&gt;East Beach&lt;/h3&gt;
          &lt;p&gt;A quieter stretch of waterfront east of the pier, with beach access below and older character homes on the bluff above.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;West Beach&lt;/h3&gt;
          &lt;p&gt;West of the pier, home to some of the city's newer waterfront condo developments.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;04&lt;/div&gt;
          &lt;h3&gt;Uptown / The Hill&lt;/h3&gt;
          &lt;p&gt;The higher&amp;#8209;elevation area around the city centre, away from the water, with more single&amp;#8209;family homes and views back down over the bay.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;05&lt;/div&gt;
          &lt;h3&gt;Five Corners&lt;/h3&gt;
          &lt;p&gt;The historic commercial intersection near the top of the hill, a walkable hub of shops, cafes, and older homes.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;06&lt;/div&gt;
          &lt;h3&gt;Johnston Road Corridor&lt;/h3&gt;
          &lt;p&gt;The main commercial spine running down to the waterfront, increasingly home to newer mid&amp;#8209;rise condo and townhome developments.&lt;/p&gt;
        &lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-life-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Lifestyle&lt;/div&gt;
        &lt;h2 id="wr-life-title"&gt;Why White Rock? The Beach, the Pier &amp;amp; an Independent City&lt;/h2&gt;
        &lt;p&gt;White Rock trades size for waterfront, and most residents wouldn't trade back.&lt;/p&gt;
      &lt;/div&gt;
      &lt;ul class="wr-life"&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🌉 &lt;/span&gt;The 470&amp;#8209;Metre Pier&lt;/h3&gt;
          &lt;p&gt;White Rock Pier stretches 470 metres into Semiahmoo Bay. Built in 1914, it is billed by the city's own signage as Canada's longest pier.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏖️ &lt;/span&gt;The Waterfront Promenade&lt;/h3&gt;
          &lt;p&gt;A long oceanfront walkway lined with restaurants and cafes on Marine Drive is the social heart of the city, especially at sunset.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏙️ &lt;/span&gt;One of Metro Vancouver's Smallest Cities&lt;/h3&gt;
          &lt;p&gt;At just over 5 square kilometres, White Rock is among the smallest municipalities in the region. You can walk from the hill down to the beach in about 15 minutes.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚫 &lt;/span&gt;No SkyTrain&lt;/h3&gt;
          &lt;p&gt;White Rock has no direct SkyTrain access; residents rely on bus connections and Highway 99, about 45 minutes to downtown Vancouver by car.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏥 &lt;/span&gt;Peace Arch Hospital&lt;/h3&gt;
          &lt;p&gt;The city has its own hospital, serving both White Rock and neighbouring South Surrey.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🗳️ &lt;/span&gt;An Independent City Since 1957&lt;/h3&gt;
          &lt;p&gt;White Rock split off from the District of Surrey in 1957 and has governed itself ever since, even though Surrey surrounds it on three sides.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📚 &lt;/span&gt;Schools&lt;/h3&gt;
          &lt;p&gt;Public schools fall under &lt;strong&gt;School District 36&lt;/strong&gt;, the same district that covers Surrey.&lt;/p&gt;
        &lt;/li&gt;
        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🌅 &lt;/span&gt;Sunsets Over Semiahmoo Bay&lt;/h3&gt;
          &lt;p&gt;The pier and promenade face almost due west, making White Rock one of the best sunset&amp;#8209;watching spots in the Lower Mainland.&lt;/p&gt;
        &lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"White Rock is the smallest city on this list, and that's really the whole story. Most buyers here aren't choosing between neighbourhoods so much as choosing between the beach and the hill. As an engineer, I pay close attention to the pier's history: it's been damaged and rebuilt more than once after winter storms, which tells you something about building this close to the water. I walk clients through what that history means for any waterfront property, condo or house, before they make an offer."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About White Rock Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is White Rock a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;White Rock's small size means very little new land ever comes to market, which has historically helped values hold up well, though it also means prices per square foot near the water rank among the highest in the Fraser Valley. Talk to Nader for a current&amp;#8209;day read on a specific street.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in White Rock, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. White Rock's higher average price points mean fewer purchases qualify for the first&amp;#8209;time buyer exemption (full up to an $835,000 fair market value, partial to $860,000), though condos away from the waterfront can still fall within range. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is White Rock part of Surrey?&lt;/summary&gt;
          &lt;p&gt;No. White Rock has governed itself as an independent city since 1957, when it split off from the District of Surrey, even though Surrey still surrounds it on the north, east, and west.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is White Rock on the SkyTrain?&lt;/summary&gt;
          &lt;p&gt;No. White Rock has no SkyTrain station of its own; the nearest stations are in Surrey, and most residents rely on bus connections or driving Highway 99, about 45 minutes to downtown Vancouver.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What school district serves White Rock?&lt;/summary&gt;
          &lt;p&gt;Public schools fall under School District 36, the same district that covers Surrey.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What areas does this White Rock search cover?&lt;/summary&gt;
          &lt;p&gt;This search covers White Rock, including Waterfront/Marine Drive, East Beach, West Beach, Uptown/The Hill, Five Corners, and the Johnston Road corridor.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
