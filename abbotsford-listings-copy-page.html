&lt;style&gt;

  /* Everything is scoped under .wr so it cannot restyle the platform's header,

    --ink-soft: #48576A;

  .wr :where(h1, h2, h3, p, ul, ol, li, blockquote, figure) { margin: 0; padding: 0; }
  .wr :where(ul, ol) { list-style: none; }
  .wr a { color: var(--brass-deep); }
  .wr a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  .wr-wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
  .wr-mono { font-family: var(--mono); }

  /* Hero */
  .wr-hero-bg { position: relative; }
  .wr-hero-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(28, 43, 57, .05) 1px, transparent 1px),

  }
  .wr-crumbs {
    position: relative;
    padding-top: 26px;
    font-family: var(--mono);

  }
  .wr-crumbs ol { display: flex; flex-wrap: wrap; gap: 6px; }
  .wr-crumbs li + li::before { content: "/"; margin-right: 6px; }
  .wr-crumbs a { color: inherit; text-decoration: none; }

  .wr-hero { position: relative; padding: 22px 0 44px; }

    justify-content: space-between;
    gap: 20px;
    padding: 22px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

  .wr-faq summary::-webkit-details-marker { display: none; }
  .wr-faq summary::after {
    content: "+";
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 18px;
    color: var(--brass-deep);
    transition: transform .2s ease;

  .wr-faq details[open] summary::after { transform: rotate(45deg); }
  .wr-faq summary:focus-visible { outline: 2px solid var(--brass-deep); outline-offset: 2px; }
  .wr-faq details p { max-width: 70ch; padding-bottom: 22px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }

  .wr-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--ink); border: 1px solid var(--ink); }
  .wr-cta &gt; div { padding: 38px; background: var(--paper); }
  .wr-cta .wr-mono { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--survey-green); }
  .wr-cta h3 { margin: 10px 0 18px; font-family: var(--serif); font-size: 21px; font-weight: 500; }
  .wr-btn {

    text-transform: uppercase;
    text-decoration: none;

  }
  .wr a.wr-btn { color: var(--paper); }
  .wr-btn:hover, .wr a.wr-btn:hover { background: var(--brass-deep); color: var(--paper); }

  /* Compliance */
  .wr-legal { padding: 0 32px 40px; max-width: 1180px; margin: 0 auto; font-size: 12px; line-height: 1.6; color: var(--muted); }

  @media (max-width: 860px) {
    .wr-wrap { padding: 0 20px; }
    .wr-neigh, .wr-life, .wr-cta { grid-template-columns: 1fr; }
    .wr-take-inner { grid-template-columns: 1fr; gap: 16px; }

        &lt;p class="wr-sub"&gt;Abbotsford is the heart of the Fraser Valley, offering more affordable housing than Metro Vancouver, mountain views, and a vibrant community. It's home to the University of the Fraser Valley's main campus and Abbotsford International Airport, host of the long&amp;#8209;running Abbotsford International Airshow, a mix that draws students, commuters, and growing families alike. With hundreds of active listings, prices range widely, from a modern condo to a luxury estate. Whether you're looking for a &lt;strong&gt;family home in West Abbotsford&lt;/strong&gt;, a &lt;strong&gt;townhouse near Mill Lake&lt;/strong&gt;, or a &lt;strong&gt;country property on Sumas Mountain&lt;/strong&gt;, Abbotsford has something for everyone.&lt;/p&gt;

        &lt;li&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;✈️ &lt;/span&gt;Airshow Heritage&lt;/h3&gt;
          &lt;p&gt;&lt;strong&gt;Abbotsford International Airport&lt;/strong&gt; hosts the long&amp;#8209;running Abbotsford International Airshow, which draws large crowds each summer.&lt;/p&gt;
        &lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"Abbotsford is a market where value meets opportunity. As an engineer, I look at the structural integrity of a property and its long&amp;#8209;term potential. In Abbotsford, buyers often find more square footage for their dollar, and the growing infrastructure makes it a smart investment. I help my clients see past the surface and focus on what matters."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About Abbotsford Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Abbotsford a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;Abbotsford offers more affordable entry points than Metro Vancouver, with a growing economy and proximity to the U.S. border. The market includes a mix of condos, townhomes, and single&amp;#8209;family homes. Talk to Nader for a current&amp;#8209;day read on specific neighbourhoods.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in Abbotsford, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. Many Abbotsford condos and townhomes also qualify for the first&amp;#8209;time buyer exemption, which fully removes the tax up to an $835,000 fair market value. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;How far is Abbotsford from downtown Vancouver?&lt;/summary&gt;
          &lt;p&gt;About 60 to 75 minutes by car via Highway 1, depending on traffic.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Abbotsford part of Metro Vancouver?&lt;/summary&gt;
          &lt;p&gt;No. Abbotsford sits in the Fraser Valley Regional District, not the Metro Vancouver regional district. That distinction matters if you're comparing regional taxes, transit fare zones, or development policy between Abbotsford and cities like Surrey or Langley.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What school district serves Abbotsford, and is there a university nearby?&lt;/summary&gt;
          &lt;p&gt;Public schools fall under School District 34 Abbotsford. The city is also home to the University of the Fraser Valley's main campus, plus private options like MEI, a plus for buyers weighing rental demand near campus.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What areas does this Abbotsford search cover?&lt;/summary&gt;
          &lt;p&gt;This search covers Abbotsford, including downtown, Sumas Mountain, Mill Lake, West Abbotsford, East Abbotsford, and Clearbrook.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
