  /* Everything is scoped under .wr so it cannot restyle the platform's header,
     listing grid or footer. Class names are prefixed wr- to avoid collisions. */
  .wr {
    --paper: #F6F3EC;
    --paper-line: #DAD4C4;
    --ink: #1C2B39;
    --ink-soft: #48576A;
    --brass: #B0793A;
    --brass-deep: #8E5F27;
    --survey-green: #54746A;
    --muted: #6B6556;
    --white: #FFFFFF;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wr *, .wr *::before, .wr *::after { box-sizing: border-box; }
  /* :where() keeps the reset at zero specificity so the component rules below always win */
  .wr :where(h1, h2, h3, p, ul, ol, li, blockquote, figure) { margin: 0; padding: 0; }
  .wr :where(ul, ol) { list-style: none; }
  .wr a { color: var(--brass-deep); }
  .wr a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  .wr-wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
  .wr-mono { font-family: var(--mono); }

  /* Hero */
  .wr-hero-bg { position: relative; }
  .wr-hero-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(28, 43, 57, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28, 43, 57, .05) 1px, transparent 1px);
    background-size: 220px 220px;
    pointer-events: none;
  }
  .wr-crumbs {
    position: relative;
    padding-top: 26px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .wr-crumbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .wr-crumbs a { color: inherit; text-decoration: none; }
  .wr-crumbs a:hover { color: var(--brass-deep); }

  .wr-hero { position: relative; padding: 22px 0 44px; }
  .wr-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--brass-deep);
  }
  .wr-eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--brass-deep); }
  .wr-hero h2 {
    max-width: 18ch;
    font-family: var(--serif);
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 500;
    line-height: 1.1;
  }
  .wr-sub { margin-top: 20px; max-width: 70ch; font-size: 16.5px; line-height: 1.7; color: var(--ink-soft); }
  .wr-note { margin-top: 14px; max-width: 70ch; font-size: 14px; color: var(--ink-soft); }

  /* Sections */
  .wr-block { position: relative; padding: 70px 0; }
  .wr-block-tight { padding-top: 0; }
  .wr-head { max-width: 640px; margin-bottom: 40px; }
  .wr-head h2 {
    font-family: var(--serif);
    font-size: clamp(24px, 2.6vw, 32px);
    font-weight: 500;
    line-height: 1.2;
  }
  .wr-head p { margin-top: 12px; font-size: 15px; color: var(--ink-soft); }

  /* Neighbourhoods */
  .wr-neigh {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--ink);
    border: 1px solid var(--ink);
  }
  .wr-neigh &gt; div { background: var(--paper); padding: 26px; }
  .wr-coord { margin-bottom: 10px; font-family: var(--mono); font-size: 12px; color: var(--survey-green); }

  .wr-life { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .wr-life &gt; div { padding: 28px; background: var(--white); border: 1px solid var(--paper-line); }

  .wr-take { position: relative; padding: 64px 0; overflow: hidden; background: var(--ink); color: var(--paper); }
  .wr-take::before {
    content: "";

    inset: 0;
    background-image:

      linear-gradient(90deg, rgba(246, 243, 236, .05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .wr-take-inner {
    position: relative;
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 40px;
    align-items: start;
  }
  .wr-take-label { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }

  /* FAQ: native &lt;details&gt;, so it works without JavaScript and answers never get clipped */
  .wr-faq details { border-bottom: 1px solid var(--paper-line); }
  .wr-faq details:first-child { border-top: 1px solid var(--ink); }
  .wr-faq summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  .wr-faq summary::-webkit-details-marker { display: none; }
  .wr-faq summary::after {
    content: "+";
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 18px;
    color: var(--brass-deep);
    transition: transform .2s ease;
  }
  .wr-faq details[open] summary::after { transform: rotate(45deg); }
  .wr-faq summary:focus-visible { outline: 2px solid var(--brass-deep); outline-offset: 2px; }
  .wr-faq details p { max-width: 70ch; padding-bottom: 22px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }

  /* Calls to action */
  .wr-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--ink); border: 1px solid var(--ink); }
  .wr-cta &gt; div { padding: 38px; background: var(--paper); }
  .wr-cta .wr-mono { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--survey-green); }
  .wr-cta h3 { margin: 10px 0 18px; font-family: var(--serif); font-size: 21px; font-weight: 500; }
  .wr-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .15s ease;
  }
  .wr a.wr-btn { color: var(--paper); }
  .wr-btn:hover, .wr a.wr-btn:hover { background: var(--brass-deep); color: var(--paper); }

  /* Market snapshot (reuses the .wr-neigh grid so it matches the neighbourhood block) */
  .wr-neigh-4 { grid-template-columns: repeat(4, 1fr); }
  .wr-kpis &gt; div { padding: 22px 26px; }
  .wr-kpi-val { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1.2; }
  .wr-types { margin-top: 28px; }
  .wr-facts { margin: 14px 0 0; }
  .wr-facts &gt; div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--paper-line); font-size: 14px; }
  .wr-facts &gt; div:last-child { border-bottom: 0; }
  .wr-facts dt { color: var(--ink-soft); }
  .wr-facts dd { margin: 0; font-weight: 600; text-align: right; }
  .wr-marketnote { max-width: 70ch; margin-top: 28px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
  .wr-src { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* Compliance */
  .wr-legal { padding: 0 32px 40px; max-width: 1180px; margin: 0 auto; font-size: 12px; line-height: 1.6; color: var(--muted); }

  @media (max-width: 860px) {
    .wr-wrap { padding: 0 20px; }
    .wr-neigh, .wr-life, .wr-cta { grid-template-columns: 1fr; }
    .wr-take-inner { grid-template-columns: 1fr; gap: 16px; }
    .wr-legal { padding: 0 20px 40px; }
    .wr-block { padding: 48px 0; }
    .wr-neigh-4 { grid-template-columns: repeat(2, 1fr); }
  }
&lt;/style&gt;

          &lt;dl class="wr-facts"&gt;
            &lt;div&gt;&lt;dt&gt;Active now&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.active"&gt;164&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median list price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianList"&gt;$1,519,500&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.sold"&gt;179&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianSold"&gt;$1,400,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.dom"&gt;22&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;p class="wr-marketnote"&gt;About &lt;span data-wr="perMonth"&gt;75&lt;/span&gt; homes sold per month over the past year, and half of them sold within &lt;span data-wr="domMedian"&gt;25&lt;/span&gt; days of listing. Condos are the bulk of the market: &lt;span data-wr="condo.sold"&gt;635&lt;/span&gt; of the &lt;span data-wr="sold12"&gt;903&lt;/span&gt; sales and &lt;span data-wr="condo.active"&gt;351&lt;/span&gt; of the &lt;span data-wr="active"&gt;596&lt;/span&gt; active listings, with a median sold price of &lt;span data-wr="condo.medianSold"&gt;$580,000&lt;/span&gt; against &lt;span data-wr="sfh.medianSold"&gt;$1,400,000&lt;/span&gt; for single&amp;#8209;family homes. At the past year's sales pace, today's active listings equal roughly &lt;span data-wr="supplyAll"&gt;8&lt;/span&gt; months of supply overall, about &lt;span data-wr="supplyCondo"&gt;7&lt;/span&gt; months for condos and about &lt;span data-wr="supplySfh"&gt;11&lt;/span&gt; for single&amp;#8209;family homes. Supply above about six months generally favours buyers. Want numbers for a specific street or building? &lt;a href="/sell"&gt;Ask for a free home valuation&lt;/a&gt;, or see the &lt;a href="/latest-market-updates"&gt;latest market updates&lt;/a&gt; and &lt;a href="/new-westminster-sold-listings"&gt;recently sold New Westminster homes&lt;/a&gt;.&lt;/p&gt;
      &lt;p class="wr-src"&gt;Source: MLS&amp;reg; listing and sold data shown on this site. Active listings were counted on &lt;span data-wr="asOf"&gt;October 30, 2026&lt;/span&gt;. Sales cover &lt;span data-wr="windowStart"&gt;September 2025&lt;/span&gt; to &lt;span data-wr="windowEnd"&gt;August 2026&lt;/span&gt; because sales from the most recent weeks are not yet fully reported. Days to sell is the time from listing date to sale date. The cards leave out &lt;span data-wr="otherActive"&gt;25&lt;/span&gt; other active listings and &lt;span data-wr="otherSales"&gt;7&lt;/span&gt; other sales (vacant land and multi&amp;#8209;family).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-neigh-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Coverage&lt;/div&gt;
        &lt;h2 id="wr-neigh-title"&gt;Neighbourhoods in New Westminster&lt;/h2&gt;
        &lt;p&gt;This search spans the following New Westminster communities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-neigh" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;01&lt;/div&gt;
          &lt;h3&gt;Downtown / The Quay&lt;/h3&gt;
          &lt;p&gt;New Westminster's SkyTrain&amp;#8209;connected waterfront core, with a boardwalk market and a fast&amp;#8209;growing cluster of highrise condos along the Fraser River.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;02&lt;/div&gt;
          &lt;h3&gt;Queens Park&lt;/h3&gt;
          &lt;p&gt;The city's best&amp;#8209;known heritage neighbourhood, full of character homes around Queen's Park itself.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Sapperton&lt;/h3&gt;
          &lt;p&gt;Home to Royal Columbian Hospital, with a growing mix of townhomes and low&amp;#8209;rise condos near the Braid and Sapperton SkyTrain stations.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;04&lt;/div&gt;
          &lt;h3&gt;Uptown&lt;/h3&gt;
          &lt;p&gt;New Westminster's commercial spine along Sixth Street and Sixth Avenue, walkable and increasingly dense with new development.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;05&lt;/div&gt;
          &lt;h3&gt;Glenbrooke North&lt;/h3&gt;
          &lt;p&gt;An established, mid&amp;#8209;density neighbourhood of older houses and low&amp;#8209;rise apartments between Uptown and Queens Park.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;06&lt;/div&gt;
          &lt;h3&gt;Queensborough&lt;/h3&gt;
          &lt;p&gt;A distinct community on Lulu Island, connected by the Queensborough Bridge, with newer master&amp;#8209;planned townhome and single&amp;#8209;family development.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-life-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Lifestyle&lt;/div&gt;
        &lt;h2 id="wr-life-title"&gt;Why New Westminster? History, Transit &amp;amp; the Waterfront&lt;/h2&gt;
        &lt;p&gt;New Westminster fits a lot of history and transit into one of the region's smallest cities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-life" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;👑 &lt;/span&gt;The Royal City&lt;/h3&gt;
          &lt;p&gt;New Westminster was the original capital of the Colony of British Columbia, before Victoria took over the role in 1868.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚇 &lt;/span&gt;Two SkyTrain Lines&lt;/h3&gt;
          &lt;p&gt;The Expo and Millennium lines both serve New Westminster, including the 22nd Street, New Westminster, Columbia, Sapperton, and Braid stations. That's a lot of rapid transit for a small city.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏥 &lt;/span&gt;Royal Columbian Hospital&lt;/h3&gt;
          &lt;p&gt;One of the region's major hospitals, with trauma and cardiac services, is based in Sapperton.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🎓 &lt;/span&gt;Douglas College&lt;/h3&gt;
          &lt;p&gt;New Westminster is home to a main campus of Douglas College.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏞️ &lt;/span&gt;The Quay Boardwalk&lt;/h3&gt;
          &lt;p&gt;A riverfront walkway and market along the Fraser River, a short walk from the SkyTrain.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏘️ &lt;/span&gt;Heritage Streets&lt;/h3&gt;
          &lt;p&gt;Queens Park's tree&amp;#8209;lined streets hold some of the city's best&amp;#8209;known character homes.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📚 &lt;/span&gt;Schools&lt;/h3&gt;
          &lt;p&gt;Public schools fall under &lt;strong&gt;School District 40 New Westminster&lt;/strong&gt;.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📏 &lt;/span&gt;Compact by Design&lt;/h3&gt;
          &lt;p&gt;New Westminster is one of the smallest cities by land area in Metro Vancouver, which is part of why it's so walkable.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"New Westminster rewards buyers who think in blocks, not kilometres. It's one of the smallest cities in the region, and the difference between the Quay and Queens Park can be a short walk and a completely different kind of property. As an engineer, I pay close attention to building age here, since the mix of century&amp;#8209;old character homes and newer highrises means due diligence looks different street to street. I help my clients match the neighbourhood's age profile to what they're actually buying."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About New Westminster Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is New Westminster a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;New Westminster's small footprint and SkyTrain access tend to support steady demand, particularly for condos near the Quay and Uptown. Talk to Nader for a current&amp;#8209;day read on a specific building or street.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in New Westminster, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. New Westminster's smaller average price points mean some purchases, especially condos, can qualify for the first&amp;#8209;time buyer exemption up to an $835,000 fair market value. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;How far is New Westminster from downtown Vancouver?&lt;/summary&gt;
          &lt;p&gt;About 25 to 40 minutes by SkyTrain on the Expo Line, or roughly 25 to 40 minutes by car depending on traffic.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is New Westminster part of Metro Vancouver?&lt;/summary&gt;
          &lt;p&gt;Yes. New Westminster is a member municipality of the Metro Vancouver Regional District and one of the smallest by land area.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What school district and post-secondary options serve New Westminster?&lt;/summary&gt;
          &lt;p&gt;Public schools fall under School District 40. The city is also home to Douglas College's New Westminster campus.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What areas does this New Westminster search cover?&lt;/summary&gt;
          &lt;p&gt;This search covers New Westminster, including Downtown/The Quay, Queens Park, Sapperton, Uptown, Glenbrooke North, and Queensborough.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
