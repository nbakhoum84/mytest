            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.sold"&gt;694&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.medianSold"&gt;$1,221,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.dom"&gt;16&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Single&amp;#8209;family homes&lt;/h3&gt;
          &lt;dl class="wr-facts"&gt;
            &lt;div&gt;&lt;dt&gt;Active now&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.active"&gt;1,872&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median list price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianList"&gt;$2,298,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.sold"&gt;1,482&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianSold"&gt;$2,200,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.dom"&gt;18&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;p class="wr-marketnote"&gt;About &lt;span data-wr="perMonth"&gt;550&lt;/span&gt; homes sold per month over the past year, and half of them sold within &lt;span data-wr="domMedian"&gt;20&lt;/span&gt; days of listing. Condos are the bulk of the market: &lt;span data-wr="condo.sold"&gt;3,752&lt;/span&gt; of the &lt;span data-wr="sold12"&gt;6,599&lt;/span&gt; sales and &lt;span data-wr="condo.active"&gt;2,507&lt;/span&gt; of the &lt;span data-wr="active"&gt;4,965&lt;/span&gt; active listings, with a median sold price of &lt;span data-wr="condo.medianSold"&gt;$735,000&lt;/span&gt; against &lt;span data-wr="sfh.medianSold"&gt;$2,200,000&lt;/span&gt; for single&amp;#8209;family homes. At the past year's sales pace, today's active listings equal roughly &lt;span data-wr="supplyAll"&gt;9&lt;/span&gt; months of supply overall, about &lt;span data-wr="supplyCondo"&gt;8&lt;/span&gt; months for condos and about &lt;span data-wr="supplySfh"&gt;15&lt;/span&gt; for single&amp;#8209;family homes. Supply above about six months generally favours buyers. Want numbers for a specific street or building? &lt;a href="/sell"&gt;Ask for a free home valuation&lt;/a&gt;, or see the &lt;a href="/latest-market-updates"&gt;latest market updates&lt;/a&gt; and &lt;a href="/vancouver-sold-listings"&gt;recently sold Vancouver homes&lt;/a&gt;.&lt;/p&gt;
      &lt;p class="wr-src"&gt;Source: MLS&amp;reg; listing and sold data shown on this site. Active listings here are residential homes for sale in the City of Vancouver, so the count in the search above can differ. Active listings were counted on &lt;span data-wr="asOf"&gt;October 30, 2026&lt;/span&gt;. Sales cover &lt;span data-wr="windowStart"&gt;September 2025&lt;/span&gt; to &lt;span data-wr="windowEnd"&gt;August 2026&lt;/span&gt; because sales from the most recent weeks are not yet fully reported. Days to sell is the time from listing date to sale date. The cards leave out &lt;span data-wr="otherActive"&gt;61&lt;/span&gt; other active listings and &lt;span data-wr="otherSales"&gt;671&lt;/span&gt; other sales (multi&amp;#8209;family).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-neigh-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Coverage&lt;/div&gt;
        &lt;h2 id="wr-neigh-title"&gt;Neighbourhoods in Vancouver&lt;/h2&gt;
        &lt;p&gt;This search spans the following Vancouver communities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-neigh" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;01&lt;/div&gt;
          &lt;h3&gt;Kitsilano&lt;/h3&gt;
          &lt;p&gt;A beach&amp;#8209;adjacent neighbourhood of character homes and lowrise apartments, popular for its walkable streets.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;02&lt;/div&gt;
          &lt;h3&gt;Mount Pleasant&lt;/h3&gt;
          &lt;p&gt;An East Side neighbourhood with a mix of older industrial buildings, townhomes and midrise condos.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Yaletown&lt;/h3&gt;
          &lt;p&gt;A former warehouse district now filled with highrise condos, steps from False Creek and the Canada Line.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;04&lt;/div&gt;
          &lt;h3&gt;West End&lt;/h3&gt;
          &lt;p&gt;A dense, walkable neighbourhood wrapped around Stanley Park and English Bay.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;05&lt;/div&gt;
          &lt;h3&gt;Commercial Drive&lt;/h3&gt;
          &lt;p&gt;A long&amp;#8209;standing East Side strip known for its independent shops, cafés, and character homes.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;06&lt;/div&gt;
          &lt;h3&gt;Dunbar&lt;/h3&gt;
          &lt;p&gt;A quieter, family&amp;#8209;oriented westside neighbourhood of character and newer homes, near UBC.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-life-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Lifestyle&lt;/div&gt;
        &lt;h2 id="wr-life-title"&gt;Why Vancouver? Parks, Transit &amp;amp; the Waterfront&lt;/h2&gt;
        &lt;p&gt;Vancouver is the region's largest and most varied market, with a neighbourhood for many kinds of buyers.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-life" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🌲 &lt;/span&gt;Stanley Park&lt;/h3&gt;
          &lt;p&gt;A large urban park at the edge of downtown, with a seawall path around its shoreline.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚇 &lt;/span&gt;Three SkyTrain Lines Plus SeaBus&lt;/h3&gt;
          &lt;p&gt;The Expo, Millennium, and Canada Lines all run through Vancouver, alongside the SeaBus across Burrard Inlet.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏛️ &lt;/span&gt;Not the Capital&lt;/h3&gt;
          &lt;p&gt;Vancouver is BC's most populous city, but Victoria, on Vancouver Island, is the provincial capital.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🎓 &lt;/span&gt;UBC &amp;amp; SFU&lt;/h3&gt;
          &lt;p&gt;UBC's Point Grey campus sits beside the city, and SFU has a downtown campus at Harbour Centre.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🛶 &lt;/span&gt;Granville Island&lt;/h3&gt;
          &lt;p&gt;A public market and artisan district under the Granville Street Bridge, reachable by small passenger ferry across False Creek.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏔️ &lt;/span&gt;2010 Winter Olympics Legacy&lt;/h3&gt;
          &lt;p&gt;Vancouver co&amp;#8209;hosted the 2010 Winter Olympics, leaving behind the Olympic Village on the False Creek waterfront.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📚 &lt;/span&gt;Schools&lt;/h3&gt;
          &lt;p&gt;Public schools fall under the &lt;strong&gt;Vancouver School Board, School District 39&lt;/strong&gt;.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;💰 &lt;/span&gt;The Empty Homes Tax&lt;/h3&gt;
          &lt;p&gt;The City of Vancouver charges its own Empty Homes Tax on vacant properties.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"Vancouver is a market where almost every rule has an exception. A westside character home and a downtown highrise condo are barely the same asset class, even though both are technically Vancouver real estate. As an engineer, I find the older housing stock in neighbourhoods like Kitsilano and Dunbar the most interesting to dig into, since wiring, plumbing and drainage in older homes deserve a close look. I help my clients read a building's real condition, not just its address."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About Vancouver Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Vancouver a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;Vancouver's market varies enormously by neighbourhood and property type, and a downtown condo and a westside house behave very differently. Talk to Nader for a current&amp;#8209;day read on a specific neighbourhood or building.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in Vancouver, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. Vancouver's range spans from condos, some near the first&amp;#8209;time buyer exemption threshold (up to an $835,000 fair market value), to houses well above it. The City of Vancouver also charges its own Empty Homes Tax on vacant properties, which is worth understanding before buying an investment property here, so check the City's site for the current rate. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Vancouver the capital of British Columbia?&lt;/summary&gt;
          &lt;p&gt;No. Although Vancouver is the province's largest city, Victoria, on Vancouver Island, is the provincial capital.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What SkyTrain lines run through Vancouver?&lt;/summary&gt;
          &lt;p&gt;The Expo Line, Millennium Line, and Canada Line all run through the city. The SeaBus also crosses Burrard Inlet to the North Shore.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What school district serves Vancouver?&lt;/summary&gt;
          &lt;p&gt;Public schools fall under the Vancouver School Board, School District 39.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What areas does this Vancouver search cover?&lt;/summary&gt;
          &lt;p&gt;This search covers Vancouver, including Kitsilano, Mount Pleasant, Yaletown, the West End, Commercial Drive, and Dunbar, a sample of the city's many distinct neighbourhoods.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
