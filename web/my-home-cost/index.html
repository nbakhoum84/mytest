<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Home Cost</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#fff;--text:#111827;--muted:#6b7280;--primary:#0f4c81;--card:#f3f4f6;--border:#e5e7eb}
  @media(prefers-color-scheme:dark){:root{--bg:#111827;--text:#f9fafb;--muted:#9ca3af;--primary:#60a5fa;--card:#1f2937;--border:#374151}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding-bottom:64px}
  main{max-width:560px;margin:0 auto;padding:20px}
  h1{font-size:22px;margin:0 0 16px}
  label{color:var(--muted);display:block;margin-bottom:6px}
  input[type=text]{width:100%;font-size:18px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
  .total{background:var(--card);padding:10px;border-radius:8px;margin-top:8px;border:0;color:var(--primary);font-weight:700;font-size:18px}
  .note{color:var(--muted);font-size:12px;margin-top:16px}
  .step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .done{text-decoration:line-through;color:var(--muted)}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--border)}
  nav button{flex:1;padding:14px;border:0;background:none;color:var(--muted);font-size:14px}
  nav button.on{color:var(--primary);font-weight:700}
  [hidden]{display:none}
</style>
</head>
<body>
<main>
  <section id="costs">
    <h1>My Home Cost</h1>
    <label for="price">Purchase price (CAD)</label>
    <input id="price" type="text" inputmode="numeric" value="900000">
    <div class="row"><span>First-time buyer exemption</span><input id="ftb" type="checkbox"></div>
    <div id="items"></div>
    <div class="row total"><span>Estimated total</span><span id="total"></span></div>
    <p class="note">Estimate only. Exemption shown applies up to $835,000; confirm eligibility with your lawyer. Excludes GST on new builds and adjustments.</p>
  </section>
  <section id="list" hidden>
    <h1>Buyer checklist (<span id="count">0</span>/10)</h1>
    <div id="steps"></div>
  </section>
</main>
<nav><button id="t-costs" class="on">Costs</button><button id="t-list">Checklist</button></nav>
<script>
const STEPS=['Get mortgage pre-approval','Set budget incl. closing costs','Find and view homes','Submit offer with subjects','Book home inspection','Remove subjects & pay deposit','Arrange home insurance','Final walk-through','Sign at lawyer/notary','Get keys on possession day'];
const band=(p,from,to,rate)=>Math.max(0,Math.min(p,to)-from)*rate;
const ptt=p=>band(p,0,2e5,.01)+band(p,2e5,2e6,.02)+band(p,2e6,Infinity,.03)+band(p,3e6,Infinity,.02);
const money=n=>'$'+Math.round(n).toLocaleString('en-CA');
const $=id=>document.getElementById(id);
function calc(){
  const p=parseFloat($('price').value.replace(/[^0-9.]/g,''))||0;
  const items=[['Property transfer tax',$('ftb').checked&&p<=835000?0:ptt(p)],['Legal fees & disbursements',1800],['Home inspection',500],['Appraisal',400]];
  $('items').innerHTML=items.map(([l,a])=>`<div class="row"><span>${l}</span><span>${money(a)}</span></div>`).join('');
  $('total').textContent=money(items.reduce((s,i)=>s+i[1],0));
}
let done=[];try{done=JSON.parse(localStorage.getItem('cc-done')||'[]')}catch(e){}
function renderSteps(){
  $('steps').innerHTML=STEPS.map((s,i)=>`<div class="step" data-i="${i}"><span>${done[i]?'☑':'☐'}</span><span class="${done[i]?'done':''}">${s}</span></div>`).join('');
  $('count').textContent=done.filter(Boolean).length;
}
$('steps').onclick=e=>{const d=e.target.closest('.step');if(!d)return;const i=+d.dataset.i;done[i]=!done[i];try{localStorage.setItem('cc-done',JSON.stringify(done))}catch(e){}renderSteps()};
$('price').oninput=calc;$('ftb').onchange=calc;
function tab(t){$('costs').hidden=t!=='costs';$('list').hidden=t!=='list';$('t-costs').className=t==='costs'?'on':'';$('t-list').className=t==='list'?'on':''}
$('t-costs').onclick=()=>tab('costs');$('t-list').onclick=()=>tab('list');
calc();renderSteps();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
