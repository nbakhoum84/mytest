<!-- Home Nader: white header text while the header is sticky.
     Paste into Lofty: Site Settings > Custom Code (Header / <head> section). Needs no class names:
     the script finds whichever top bar is fixed/sticky on the page and tags it. -->
<style>
  .hn-stuck,
  .hn-stuck a,
  .hn-stuck li,
  .hn-stuck span,
  .hn-stuck p,
  .hn-stuck i,
  .hn-stuck button,
  .hn-stuck svg {
    color: #fff !important;
    fill: #fff;
  }
  /* Optional: dark bar so white text stays readable on light sections. Delete if not wanted. */
  .hn-stuck { background-color: rgba(15, 23, 42, .92) !important; }
</style>
<script>
  (function () {
    function candidates() {
      return document.querySelectorAll(
        'header, nav, [class*="header"], [class*="Header"], [class*="navbar"], [class*="nav-"], [id*="header"], [id*="nav"]'
      );
    }
    function update() {
      var list = candidates();
      for (var i = 0; i < list.length; i++) {
        var el = list[i];
        var cs = getComputedStyle(el);
        var r = el.getBoundingClientRect();
        var pinned = (cs.position === 'fixed' || cs.position === 'sticky') &&
                     r.top <= 2 && r.height > 30 && r.width > window.innerWidth * 0.6;
        var scrolled = (window.pageYOffset || document.documentElement.scrollTop) > 40;
        el.classList.toggle('hn-stuck', pinned && scrolled);
      }
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    window.addEventListener('load', update);
    setTimeout(update, 500);
    update();
  })();
</script>
