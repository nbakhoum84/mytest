  /* Everything is scoped under .wr so it cannot restyle the platform's header,
     listing grid or footer. Class names are prefixed wr- to avoid collisions. */
  .wr {
    --paper: #F6F3EC;
    --paper-line: #DAD4C4;
    --ink: #1C2B39;
    --ink-soft: #48576A;
    --brass: #B0793A;
    --brass-deep: #8E5F27;
    --survey-green: #54746A;
    --muted: #6B6556;
    --white: #FFFFFF;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wr *, .wr *::before, .wr *::after { box-sizing: border-box; }
  /* :where() keeps the reset at zero specificity so the component rules below always win */
  .wr :where(h1, h2, h3, p, ul, ol, li, blockquote, figure) { margin: 0; padding: 0; }
  .wr :where(ul, ol) { list-style: none; }
  .wr a { color: var(--brass-deep); }
  .wr a:hover { color: var(--ink); }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  .wr-wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
  .wr-mono { font-family: var(--mono); }

  /* Hero */
  .wr-hero-bg { position: relative; }
  .wr-hero-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(28, 43, 57, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28, 43, 57, .05) 1px, transparent 1px);
    background-size: 220px 220px;
    pointer-events: none;
  }
  .wr-crumbs {
    position: relative;
    padding-top: 26px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
  .wr-crumbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .wr-crumbs a { color: inherit; text-decoration: none; }
  .wr-crumbs a:hover { color: var(--brass-deep); }

  .wr-hero { position: relative; padding: 22px 0 44px; }
  .wr-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--brass-deep);
  }
  .wr-eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--brass-deep); }
  .wr-hero h2 {
    max-width: 18ch;
    font-family: var(--serif);
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 500;
    line-height: 1.1;
  }
  .wr-sub { margin-top: 20px; max-width: 70ch; font-size: 16.5px; line-height: 1.7; color: var(--ink-soft); }
  .wr-note { margin-top: 14px; max-width: 70ch; font-size: 14px; color: var(--ink-soft); }

  /* Sections */
  .wr-block { position: relative; padding: 70px 0; }
  .wr-block-tight { padding-top: 0; }
  .wr-head { max-width: 640px; margin-bottom: 40px; }
  .wr-head h2 {
    font-family: var(--serif);
    font-size: clamp(24px, 2.6vw, 32px);
    font-weight: 500;
    line-height: 1.2;
  }
  .wr-head p { margin-top: 12px; font-size: 15px; color: var(--ink-soft); }

  /* Neighbourhoods */
  .wr-neigh {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--ink);
    border: 1px solid var(--ink);
  }
  .wr-neigh &gt; div { background: var(--paper); padding: 26px; }
  .wr-coord { margin-bottom: 10px; font-family: var(--mono); font-size: 12px; color: var(--survey-green); }
  .wr-neigh h3 { font-size: 16px; font-weight: 600; }
  .wr-neigh p { margin-top: 10px; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }

  /* Lifestyle */
  .wr-life { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .wr-life &gt; div { padding: 28px; background: var(--white); border: 1px solid var(--paper-line); }
  .wr-life h3 { margin-bottom: 8px; font-family: var(--serif); font-size: 18px; font-weight: 500; }
  .wr-life p { font-size: 14.5px; line-height: 1.7; color: var(--ink-soft); }

  /* Nader's take */
  .wr-take { position: relative; padding: 64px 0; overflow: hidden; background: var(--ink); color: var(--paper); }
  .wr-take::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(246, 243, 236, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246, 243, 236, .05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .wr-take-inner {
    position: relative;
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 40px;
    align-items: start;
  }
  .wr-take-label { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }
  .wr-take blockquote { font-family: var(--serif); font-size: clamp(18px, 2vw, 22px); line-height: 1.6; }
  .wr-take cite { display: block; margin-top: 18px; font-family: var(--mono); font-size: 12px; font-style: normal; color: #B9C1CA; }

  /* FAQ: native &lt;details&gt;, so it works without JavaScript and answers never get clipped */
  .wr-faq details { border-bottom: 1px solid var(--paper-line); }
  .wr-faq details:first-child { border-top: 1px solid var(--ink); }
  .wr-faq summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  .wr-faq summary::-webkit-details-marker { display: none; }
  .wr-faq summary::after {
    content: "+";
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 18px;
    color: var(--brass-deep);
    transition: transform .2s ease;
  }
  .wr-faq details[open] summary::after { transform: rotate(45deg); }
  .wr-faq summary:focus-visible { outline: 2px solid var(--brass-deep); outline-offset: 2px; }
  .wr-faq details p { max-width: 70ch; padding-bottom: 22px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }

  /* Calls to action */
  .wr-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--ink); border: 1px solid var(--ink); }
  .wr-cta &gt; div { padding: 38px; background: var(--paper); }
  .wr-cta .wr-mono { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--survey-green); }
  .wr-cta h3 { margin: 10px 0 18px; font-family: var(--serif); font-size: 21px; font-weight: 500; }
  .wr-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .15s ease;
  }
  .wr a.wr-btn { color: var(--paper); }
  .wr-btn:hover, .wr a.wr-btn:hover { background: var(--brass-deep); color: var(--paper); }

  /* Market snapshot (reuses the .wr-neigh grid so it matches the neighbourhood block) */
  .wr-neigh-4 { grid-template-columns: repeat(4, 1fr); }
  .wr-kpis &gt; div { padding: 22px 26px; }
  .wr-kpi-val { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1.2; }
  .wr-types { margin-top: 28px; }
  .wr-facts { margin: 14px 0 0; }
  .wr-facts &gt; div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--paper-line); font-size: 14px; }
  .wr-facts &gt; div:last-child { border-bottom: 0; }
  .wr-facts dt { color: var(--ink-soft); }
  .wr-facts dd { margin: 0; font-weight: 600; text-align: right; }
  .wr-marketnote { max-width: 70ch; margin-top: 28px; font-size: 15px; line-height: 1.7; color: var(--ink-soft); }
  .wr-src { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* Compliance */
  .wr-legal { padding: 0 32px 40px; max-width: 1180px; margin: 0 auto; font-size: 12px; line-height: 1.6; color: var(--muted); }

  @media (max-width: 860px) {
    .wr-wrap { padding: 0 20px; }
    .wr-neigh, .wr-life, .wr-cta { grid-template-columns: 1fr; }
    .wr-take-inner { grid-template-columns: 1fr; gap: 16px; }
    .wr-legal { padding: 0 20px 40px; }
    .wr-block { padding: 48px 0; }
    .wr-neigh-4 { grid-template-columns: repeat(2, 1fr); }
  }
&lt;/style&gt;

            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.dom"&gt;21&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Single&amp;#8209;family homes&lt;/h3&gt;
          &lt;dl class="wr-facts"&gt;
            &lt;div&gt;&lt;dt&gt;Active now&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.active"&gt;599&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median list price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianList"&gt;$1,750,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.sold"&gt;991&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianSold"&gt;$1,422,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.dom"&gt;24&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;p class="wr-marketnote"&gt;About &lt;span data-wr="perMonth"&gt;227&lt;/span&gt; homes sold per month over the past year, and half of them sold within &lt;span data-wr="domMedian"&gt;24&lt;/span&gt; days of listing. Single&amp;#8209;family homes are the bulk of the market: &lt;span data-wr="sfh.sold"&gt;991&lt;/span&gt; of the &lt;span data-wr="sold12"&gt;2,722&lt;/span&gt; sales and &lt;span data-wr="sfh.active"&gt;599&lt;/span&gt; of the &lt;span data-wr="active"&gt;1,320&lt;/span&gt; active listings, with a median sold price of &lt;span data-wr="sfh.medianSold"&gt;$1,422,000&lt;/span&gt; against &lt;span data-wr="condo.medianSold"&gt;$520,000&lt;/span&gt; for condos. At the past year's sales pace, today's active listings equal roughly &lt;span data-wr="supplyAll"&gt;6&lt;/span&gt; months of supply overall, about &lt;span data-wr="supplyCondo"&gt;6&lt;/span&gt; months for condos and about &lt;span data-wr="supplySfh"&gt;7&lt;/span&gt; for single&amp;#8209;family homes. Supply above about six months generally favours buyers. Want numbers for a specific street or building? &lt;a href="/sell"&gt;Ask for a free home valuation&lt;/a&gt;, or see the &lt;a href="/latest-market-updates"&gt;latest market updates&lt;/a&gt; and &lt;a href="/langley-sold-listings"&gt;recently sold Langley homes&lt;/a&gt;.&lt;/p&gt;
      &lt;p class="wr-src"&gt;Source: MLS&amp;reg; listing and sold data shown on this site. Active listings were counted on &lt;span data-wr="asOf"&gt;October 30, 2026&lt;/span&gt;. Sales cover &lt;span data-wr="windowStart"&gt;September 2025&lt;/span&gt; to &lt;span data-wr="windowEnd"&gt;August 2026&lt;/span&gt; because sales from the most recent weeks are not yet fully reported. Days to sell is the time from listing date to sale date. The cards leave out &lt;span data-wr="otherActive"&gt;106&lt;/span&gt; other active listings and &lt;span data-wr="otherSales"&gt;125&lt;/span&gt; other sales (manufactured home, vacant land and multi&amp;#8209;family).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-neigh-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Coverage&lt;/div&gt;
        &lt;h2 id="wr-neigh-title"&gt;Neighbourhoods in Langley&lt;/h2&gt;
        &lt;p&gt;This search spans the following Langley communities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-neigh" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;01&lt;/div&gt;
          &lt;h3&gt;Fort Langley&lt;/h3&gt;
          &lt;p&gt;A National Historic Site and the birthplace of the mainland Colony of British Columbia, with a walkable village core of shops, caf&amp;eacute;s, and heritage homes.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;02&lt;/div&gt;
          &lt;h3&gt;Willoughby&lt;/h3&gt;
          &lt;p&gt;One of Langley's fastest&amp;#8209;growing areas, with new townhome and condo construction around Willoughby Town Centre.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Walnut Grove&lt;/h3&gt;
          &lt;p&gt;An established, family&amp;#8209;oriented community near the Fraser River, popular for its schools and parks.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;04&lt;/div&gt;
          &lt;h3&gt;Brookswood&lt;/h3&gt;
          &lt;p&gt;A leafy, low&amp;#8209;density neighbourhood of larger lots that's slowly transitioning to newer construction as the area redevelops.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;05&lt;/div&gt;
          &lt;h3&gt;Murrayville&lt;/h3&gt;
          &lt;p&gt;A quiet, established pocket around Murrayville's small commercial strip, close to Langley's hospital and recreation centre.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;06&lt;/div&gt;
          &lt;h3&gt;Aldergrove&lt;/h3&gt;
          &lt;p&gt;Langley's easternmost community, more rural in feel, with larger acreages and easy access to Highway 1.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-life-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Lifestyle&lt;/div&gt;
        &lt;h2 id="wr-life-title"&gt;Why Langley? History, Growth &amp;amp; Open Space&lt;/h2&gt;
        &lt;p&gt;Langley pairs one of the region's fastest&amp;#8209;growing suburbs with some of its deepest history.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-life" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚇 &lt;/span&gt;SkyTrain Is Coming&lt;/h3&gt;
          &lt;p&gt;The &lt;strong&gt;Surrey&amp;#8209;Langley SkyTrain&lt;/strong&gt; extension is under construction and currently scheduled to reach Langley City Centre in late 2029.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏰 &lt;/span&gt;Fort Langley&lt;/h3&gt;
          &lt;p&gt;A National Historic Site marking where the mainland Colony of British Columbia was proclaimed in 1858.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🎓 &lt;/span&gt;Two Universities&lt;/h3&gt;
          &lt;p&gt;&lt;strong&gt;Trinity Western University&lt;/strong&gt; and a &lt;strong&gt;Kwantlen Polytechnic University&lt;/strong&gt; campus both call Langley home.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏗️ &lt;/span&gt;Still Being Built&lt;/h3&gt;
          &lt;p&gt;Willoughby is one of the region's major areas of master&amp;#8209;planned new construction.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🌳 &lt;/span&gt;Parks &amp;amp; Farmland&lt;/h3&gt;
          &lt;p&gt;From Campbell Valley Regional Park to working farms, Langley has plenty of open space.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🛍️ &lt;/span&gt;Walking{NH}Village Shopping&lt;/h3&gt;
          &lt;p&gt;Fort Langley's village core and Willoughby Town Centre offer two very different retail experiences.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📚 &lt;/span&gt;Schools&lt;/h3&gt;
          &lt;p&gt;Public schools fall under &lt;strong&gt;School District 35 Langley&lt;/strong&gt;.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚗 &lt;/span&gt;Highway 1 Corridor&lt;/h3&gt;
          &lt;p&gt;Langley sits directly on the Trans&amp;#8209;Canada Highway, midway between Abbotsford and Surrey.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"Langley is a market in two speeds: Willoughby is being built out almost block by block, while Fort Langley changes very little. As an engineer, I like watching how a new SkyTrain extension can reshape value along its corridor, and the question for any buyer is how much of that is already in today's prices. I help my clients figure out whether they're buying the neighbourhood as it is today, or the one it's about to become."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About Langley Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Langley a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;Langley is in the middle of two long&amp;#8209;term changes at once: the Surrey&amp;#8209;Langley SkyTrain extension under construction, and the ongoing build&amp;#8209;out of Willoughby. Both tend to support demand along their corridors, though timing and location within Langley matter a lot. Talk to Nader for a read on a specific area.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in Langley, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. Some Willoughby condos and townhomes can qualify for the first&amp;#8209;time buyer exemption (up to an $835,000 fair market value), while larger acreages can land in the higher tax tiers. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;How far is Langley from downtown Vancouver?&lt;/summary&gt;
          &lt;p&gt;About 45 to 60 minutes by car via Highway 1, depending on traffic and which part of Langley you're in. Transit times are expected to improve once the Surrey&amp;#8209;Langley SkyTrain extension opens, which is currently scheduled for late 2029.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Langley part of Metro Vancouver?&lt;/summary&gt;
          &lt;p&gt;Yes. Both the Township of Langley and the City of Langley are member municipalities of the Metro Vancouver Regional District.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the difference between the Township of Langley and the City of Langley?&lt;/summary&gt;
          &lt;p&gt;They're two separate municipalities with their own councils, even though they share a name and are usually searched and marketed together. The City of Langley is the smaller, denser core; the Township surrounds it and includes Willoughby, Walnut Grove, Fort Langley, Brookswood, Murrayville, and Aldergrove.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What areas does this Langley search cover?&lt;/summary&gt;
          &lt;p&gt;This search covers Langley, including Fort Langley, Willoughby, Walnut Grove, Brookswood, Murrayville, and Aldergrove.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
