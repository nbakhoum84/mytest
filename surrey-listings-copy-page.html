            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.sold"&gt;1,205&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.medianSold"&gt;$760,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="townhome.dom"&gt;26&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Single&amp;#8209;family homes&lt;/h3&gt;
          &lt;dl class="wr-facts"&gt;
            &lt;div&gt;&lt;dt&gt;Active now&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.active"&gt;1,460&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median list price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianList"&gt;$1,454,500&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.sold"&gt;1,336&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianSold"&gt;$1,320,000&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.dom"&gt;26&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;p class="wr-marketnote"&gt;About &lt;span data-wr="perMonth"&gt;310&lt;/span&gt; homes sold per month over the past year, and half of them sold within &lt;span data-wr="domMedian"&gt;28&lt;/span&gt; days of listing. Single&amp;#8209;family homes are the largest group: &lt;span data-wr="sfh.sold"&gt;1,336&lt;/span&gt; of the &lt;span data-wr="sold12"&gt;3,715&lt;/span&gt; sales and &lt;span data-wr="sfh.active"&gt;1,460&lt;/span&gt; of the &lt;span data-wr="active"&gt;3,922&lt;/span&gt; active listings, with a median sold price of &lt;span data-wr="sfh.medianSold"&gt;$1,320,000&lt;/span&gt; against &lt;span data-wr="condo.medianSold"&gt;$460,000&lt;/span&gt; for condos. At the past year's sales pace, today's active listings equal roughly &lt;span data-wr="supplyAll"&gt;13&lt;/span&gt; months of supply overall, about &lt;span data-wr="supplyCondo"&gt;12&lt;/span&gt; months for condos and about &lt;span data-wr="supplySfh"&gt;13&lt;/span&gt; for single&amp;#8209;family homes. Supply above about six months generally favours buyers. Want numbers for a specific street or building? &lt;a href="/sell"&gt;Ask for a free home valuation&lt;/a&gt;, or see the &lt;a href="/latest-market-updates"&gt;latest market updates&lt;/a&gt; and &lt;a href="/surrey-sold-listings"&gt;recently sold Surrey homes&lt;/a&gt;.&lt;/p&gt;
      &lt;p class="wr-src"&gt;Source: MLS&amp;reg; listing and sold data shown on this site. Surrey here means Surrey listings outside the postal areas V3Z, V4A and V4P, which are covered on the South Surrey page. Active listings were counted on &lt;span data-wr="asOf"&gt;October 30, 2026&lt;/span&gt;. Sales cover &lt;span data-wr="windowStart"&gt;September 2025&lt;/span&gt; to &lt;span data-wr="windowEnd"&gt;August 2026&lt;/span&gt; because sales from the most recent weeks are not yet fully reported. Days to sell is the time from listing date to sale date. The cards leave out &lt;span data-wr="otherActive"&gt;673&lt;/span&gt; other active listings and &lt;span data-wr="otherSales"&gt;77&lt;/span&gt; other sales (commercial, vacant land, multi&amp;#8209;family and manufactured home).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-neigh-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Coverage&lt;/div&gt;
        &lt;h2 id="wr-neigh-title"&gt;Neighbourhoods in Surrey&lt;/h2&gt;
        &lt;p&gt;This search spans the following Surrey communities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-neigh" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;01&lt;/div&gt;
          &lt;h3&gt;City Centre (Whalley)&lt;/h3&gt;
          &lt;p&gt;Surrey's downtown core, with a growing concentration of highrise condos.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;02&lt;/div&gt;
          &lt;h3&gt;Guildford&lt;/h3&gt;
          &lt;p&gt;An established neighbourhood built around Guildford Town Centre mall.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Newton&lt;/h3&gt;
          &lt;p&gt;A large community with a mix of established homes and newer townhome development.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;04&lt;/div&gt;
          &lt;h3&gt;Fleetwood&lt;/h3&gt;
          &lt;p&gt;A growing area on the Surrey&amp;#8209;Langley SkyTrain extension route, with new townhomes alongside established family homes.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;05&lt;/div&gt;
          &lt;h3&gt;Cloverdale&lt;/h3&gt;
          &lt;p&gt;A town centre with a heritage main street and a smaller&amp;#8209;town feel than much of the city.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;06&lt;/div&gt;
          &lt;h3&gt;Port Kells&lt;/h3&gt;
          &lt;p&gt;A smaller community on Surrey's northeast edge, near the Fraser River and the Golden Ears Bridge.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-life-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Lifestyle&lt;/div&gt;
        &lt;h2 id="wr-life-title"&gt;Why Surrey? Growth, Transit &amp;amp; Town Centres&lt;/h2&gt;
        &lt;p&gt;Surrey is really several communities under one name, each with its own character.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-life" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📈 &lt;/span&gt;A Fast-Growing City&lt;/h3&gt;
          &lt;p&gt;Surrey is the second&amp;#8209;most populous city in BC and continues to grow.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚇 &lt;/span&gt;SkyTrain Under Construction&lt;/h3&gt;
          &lt;p&gt;The Surrey&amp;#8209;Langley SkyTrain extension is under construction along Fraser Highway, with a station planned for Fleetwood.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏙️ &lt;/span&gt;City Centre&lt;/h3&gt;
          &lt;p&gt;City Centre is Surrey's downtown, with a growing cluster of highrises.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🎓 &lt;/span&gt;Post-Secondary Campuses&lt;/h3&gt;
          &lt;p&gt;Simon Fraser University and Kwantlen Polytechnic University both have campuses in Surrey.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🤠 &lt;/span&gt;The Cloverdale Rodeo&lt;/h3&gt;
          &lt;p&gt;Cloverdale hosts an annual rodeo, a link to Surrey's agricultural roots.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🌳 &lt;/span&gt;Several Communities in One&lt;/h3&gt;
          &lt;p&gt;Surrey's town centres each have their own pace and character.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📚 &lt;/span&gt;Schools&lt;/h3&gt;
          &lt;p&gt;Public schools fall under &lt;strong&gt;School District 36 Surrey&lt;/strong&gt;.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚗 &lt;/span&gt;Highway Access&lt;/h3&gt;
          &lt;p&gt;Highway 1, Highway 99, Highway 91 and Fraser Highway all serve Surrey, connecting it to the rest of Metro Vancouver and the Fraser Valley.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"Surrey is really several communities under one name. City Centre is going vertical, while Cloverdale still has a smaller&amp;#8209;town feel. As an engineer, I find the SkyTrain extension interesting to track, since transit access shapes how people choose between town centres. I help my clients figure out which version of Surrey actually fits what they're looking for."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About Surrey Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Surrey a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;Surrey's population growth and the Surrey&amp;#8209;Langley SkyTrain extension under construction are two factors many buyers watch, particularly along Fraser Highway. Talk to Nader for a current&amp;#8209;day read on a specific town centre.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in Surrey, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. Surrey's wide range spans from condos, some near the first&amp;#8209;time buyer exemption threshold (up to an $835,000 fair market value), to larger single&amp;#8209;family homes that sit above it. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;How far is Surrey from downtown Vancouver?&lt;/summary&gt;
          &lt;p&gt;By transit, the Expo Line SkyTrain runs from Surrey Central to downtown Vancouver, so check TransLink for current trip times from your station. By car, travel time depends heavily on the town centre and traffic.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Surrey part of Metro Vancouver?&lt;/summary&gt;
          &lt;p&gt;Yes. Surrey is a member municipality of the Metro Vancouver Regional District and the second&amp;#8209;most populous municipality in the region, after Vancouver.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Does this search include South Surrey?&lt;/summary&gt;
          &lt;p&gt;No. South Surrey has its own dedicated search, since its housing stock and price points differ from much of the rest of the city. This page covers the rest of Surrey, including City Centre, Guildford, Newton, Fleetwood, Cloverdale, and Port Kells.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What school district serves Surrey?&lt;/summary&gt;
          &lt;p&gt;Public schools fall under School District 36 Surrey.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
