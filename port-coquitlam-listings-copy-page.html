          &lt;/dl&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Single&amp;#8209;family homes&lt;/h3&gt;
          &lt;dl class="wr-facts"&gt;
            &lt;div&gt;&lt;dt&gt;Active now&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.active"&gt;151&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median list price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianList"&gt;$1,299,900&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Sold, past 12 months&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.sold"&gt;200&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median sold price&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.medianSold"&gt;$1,307,500&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
            &lt;div&gt;&lt;dt&gt;Median days to sell&lt;/dt&gt;&lt;dd&gt;&lt;span data-wr="sfh.dom"&gt;18&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
          &lt;/dl&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;p class="wr-marketnote"&gt;About &lt;span data-wr="perMonth"&gt;53&lt;/span&gt; homes sold per month over the past year, and half of them sold within &lt;span data-wr="domMedian"&gt;21&lt;/span&gt; days of listing. Condos are the largest group: &lt;span data-wr="condo.sold"&gt;238&lt;/span&gt; of the &lt;span data-wr="sold12"&gt;641&lt;/span&gt; sales and &lt;span data-wr="condo.active"&gt;137&lt;/span&gt; of the &lt;span data-wr="active"&gt;365&lt;/span&gt; active listings, with a median sold price of &lt;span data-wr="condo.medianSold"&gt;$562,500&lt;/span&gt; against &lt;span data-wr="sfh.medianSold"&gt;$1,307,500&lt;/span&gt; for single&amp;#8209;family homes. At the past year's sales pace, today's active listings equal roughly &lt;span data-wr="supplyAll"&gt;7&lt;/span&gt; months of supply overall, about &lt;span data-wr="supplyCondo"&gt;7&lt;/span&gt; months for condos and about &lt;span data-wr="supplySfh"&gt;9&lt;/span&gt; for single&amp;#8209;family homes. Supply above about six months generally favours buyers. Want numbers for a specific street or building? &lt;a href="/sell"&gt;Ask for a free home valuation&lt;/a&gt;, or see the &lt;a href="/latest-market-updates"&gt;latest market updates&lt;/a&gt; and &lt;a href="/port-coquitlam-sold-listings"&gt;recently sold Port Coquitlam homes&lt;/a&gt;.&lt;/p&gt;
      &lt;p class="wr-src"&gt;Source: MLS&amp;reg; listing and sold data shown on this site. Active listings were counted on &lt;span data-wr="asOf"&gt;October 30, 2026&lt;/span&gt;. Sales cover &lt;span data-wr="windowStart"&gt;September 2025&lt;/span&gt; to &lt;span data-wr="windowEnd"&gt;August 2026&lt;/span&gt; because sales from the most recent weeks are not yet fully reported. Days to sell is the time from listing date to sale date. The cards leave out &lt;span data-wr="otherActive"&gt;22&lt;/span&gt; other active listings and &lt;span data-wr="otherSales"&gt;19&lt;/span&gt; other sales (multi&amp;#8209;family and vacant land).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-neigh-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Coverage&lt;/div&gt;
        &lt;h2 id="wr-neigh-title"&gt;Neighbourhoods in Port Coquitlam&lt;/h2&gt;
        &lt;p&gt;This search spans the following Port Coquitlam communities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-neigh" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;01&lt;/div&gt;
          &lt;h3&gt;Downtown PoCo&lt;/h3&gt;
          &lt;p&gt;The city's historic core along Shaughnessy Street, with older character homes and an easy walk to Gates Park.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;02&lt;/div&gt;
          &lt;h3&gt;Oxford Heights&lt;/h3&gt;
          &lt;p&gt;A hillside neighbourhood of established homes and townhomes.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;03&lt;/div&gt;
          &lt;h3&gt;Citadel Heights&lt;/h3&gt;
          &lt;p&gt;A newer, family&amp;#8209;oriented area close to the Coquitlam River and the PoCo Trail.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;04&lt;/div&gt;
          &lt;h3&gt;Riverside&lt;/h3&gt;
          &lt;p&gt;Bordering the Fraser and Pitt Rivers, mixing industrial land with pockets of newer residential development.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;05&lt;/div&gt;
          &lt;h3&gt;Mary Hill&lt;/h3&gt;
          &lt;p&gt;An established, hillside neighbourhood with larger lots and views across the valley.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;div class="wr-coord" aria-hidden="true"&gt;06&lt;/div&gt;
          &lt;h3&gt;Birchland Manor&lt;/h3&gt;
          &lt;p&gt;A quiet, established neighbourhood of single&amp;#8209;family homes near Birchland Elementary and Hyde Creek.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-life-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;Lifestyle&lt;/div&gt;
        &lt;h2 id="wr-life-title"&gt;Why Port Coquitlam? Trails, Rivers &amp;amp; a Quieter Pace&lt;/h2&gt;
        &lt;p&gt;PoCo has a more small&amp;#8209;town feel than much of the Tri&amp;#8209;Cities.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class="wr-life" role="list"&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏃 &lt;/span&gt;The PoCo Trail&lt;/h3&gt;
          &lt;p&gt;The Traboulay PoCo Trail loops the entire city, giving residents a long, continuous trail system close to home.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏅 &lt;/span&gt;Terry Fox's Hometown&lt;/h3&gt;
          &lt;p&gt;Port Coquitlam is where Terry Fox grew up, and the city has honoured him with a secondary school and a library.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚆 &lt;/span&gt;West Coast Express&lt;/h3&gt;
          &lt;p&gt;Port Coquitlam station connects commuters to downtown Vancouver on the West Coast Express commuter rail.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🎆 &lt;/span&gt;Gates Park&lt;/h3&gt;
          &lt;p&gt;Gates Park, close to Downtown PoCo, is a popular spot for community events and everyday outdoor time.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🌳 &lt;/span&gt;Rivers &amp;amp; Parks&lt;/h3&gt;
          &lt;p&gt;The Coquitlam, Fraser and Pitt Rivers frame the city, with parks and trails running along them.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🏘️ &lt;/span&gt;A Quieter Pace&lt;/h3&gt;
          &lt;p&gt;PoCo has a more small&amp;#8209;town feel than much of the Tri&amp;#8209;Cities.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;📚 &lt;/span&gt;Schools&lt;/h3&gt;
          &lt;p&gt;Public schools fall under &lt;strong&gt;School District 43&lt;/strong&gt;, shared with Coquitlam and Port Moody.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div role="listitem"&gt;
          &lt;h3&gt;&lt;span aria-hidden="true"&gt;🚗 &lt;/span&gt;Highway Access&lt;/h3&gt;
          &lt;p&gt;The Lougheed Highway and Mary Hill Bypass connect PoCo to the rest of the Tri&amp;#8209;Cities and beyond.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-take" aria-label="Nader's take"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-take-inner"&gt;
        &lt;div class="wr-take-label"&gt;Nader's Take&lt;/div&gt;
        &lt;figure&gt;
          &lt;blockquote&gt;
            &lt;p&gt;"Port Coquitlam doesn't try to be Coquitlam, and that's exactly its appeal. It's the quieter, more family&amp;#8209;oriented option in the Tri&amp;#8209;Cities, without the highrise pace next door. As an engineer, I look closely at the age and condition of a home, which matters most in established neighbourhoods like these. I help my clients weigh that quieter pace against the shorter commute options in neighbouring Coquitlam."&lt;/p&gt;
          &lt;/blockquote&gt;
          &lt;figcaption&gt;&lt;cite&gt;Nader Bakhoum, PMP, P.Eng.&lt;/cite&gt;&lt;/figcaption&gt;
        &lt;/figure&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class="wr-block" aria-labelledby="wr-faq-title"&gt;
    &lt;div class="wr-wrap"&gt;
      &lt;div class="wr-head"&gt;
        &lt;div class="wr-eyebrow"&gt;FAQ&lt;/div&gt;
        &lt;h2 id="wr-faq-title"&gt;Frequently Asked Questions About Port Coquitlam Real Estate&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class="wr-faq"&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Port Coquitlam a good place to invest in real estate right now?&lt;/summary&gt;
          &lt;p&gt;Port Coquitlam is a smaller, family&amp;#8209;oriented market without direct SkyTrain access, and its growth has been more gradual than neighbouring Coquitlam's. Talk to Nader for a current&amp;#8209;day read on a specific street.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What's the property transfer tax on a home in Port Coquitlam, BC?&lt;/summary&gt;
          &lt;p&gt;BC's property transfer tax is 1% on the first $200,000, 2% from $200,000 to $2,000,000, 3% from $2,000,000 to $3,000,000, and a further 2% (5% total) on any residential value above $3,000,000. Some Port Coquitlam purchases, especially townhomes and condos, can qualify for the first&amp;#8209;time buyer exemption up to an $835,000 fair market value. Use the &lt;a href="/cash-to-close"&gt;Cash to Close calculator&lt;/a&gt; for an exact number.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;How far is Port Coquitlam from downtown Vancouver?&lt;/summary&gt;
          &lt;p&gt;By car it's roughly 30 to 60 minutes via the Lougheed Highway or Highway 1, depending on traffic. The West Coast Express from Port Coquitlam station takes roughly 40 to 50 minutes and currently runs on weekday rush&amp;#8209;hour schedules, so check TransLink for the latest times.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;Is Port Coquitlam on the SkyTrain?&lt;/summary&gt;
          &lt;p&gt;No. Unlike Coquitlam, Port Coquitlam isn't directly served by SkyTrain. Port Coquitlam station on the West Coast Express and bus connections to nearby Coquitlam stations are the main transit options.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What school district serves Port Coquitlam?&lt;/summary&gt;
          &lt;p&gt;Public schools fall under School District 43, the same district that covers Coquitlam and Port Moody.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details name="wr-faq"&gt;
          &lt;summary&gt;What areas does this Port Coquitlam search cover?&lt;/summary&gt;
          &lt;p&gt;This search covers Port Coquitlam, including Downtown, Oxford Heights, Citadel Heights, Riverside, Mary Hill, and Birchland Manor.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
